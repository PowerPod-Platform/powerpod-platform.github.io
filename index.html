<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf8f5">

  <title>PowerPod Platform™</title>
  <meta name="description" content="PowerPod Platform.">

  <!-- Same-origin fonts still fetch in CORS mode, so `crossorigin` is required
       here; without it the browser downloads the file a second time. -->
  <link rel="preload" href="fonts/DMSans-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>

  <!-- Ceramic glaze. Decorative only, so it is hidden from assistive tech. -->
  <div class="glaze" aria-hidden="true">
    <div class="glaze__blob glaze__blob--blush"></div>
    <div class="glaze__blob glaze__blob--celadon"></div>
    <div class="glaze__blob glaze__blob--periwinkle"></div>
    <div class="glaze__blob glaze__blob--clay"></div>
    <div class="glaze__sheen"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <h1 class="wordmark">PowerPod Platform<span class="wordmark__tm">™</span></h1>
  </main>

</body>
</html>
