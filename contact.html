<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">

  <title>Get in touch · PowerPod Platform™</title>
  <meta name="description" content="A few questions and we'll come back to you.">

  <link rel="preload" href="fonts/DMSans-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/site.css">

  <!-- The fallback for no-JS on the film page, which keeps href="contact.html"
       on the origin. Same card and same one-question-at-a-time form, on a plain
       white page: there is no film to hold behind it and no underline to grow
       out of here, and the glaze is the film page's material, not this one's.

       No perf.js. It exists to open a WebGL context, identify the GPU and set
       the tier that the film's framebuffer and the glaze's rules read, and this
       page has neither. contact.min.js carries its own Firebase app, so
       firebase.min.js is not a prerequisite either; it is loaded only for
       Analytics, and last. -->
  <script src="scripts/vendor/contact.min.js" defer></script>
  <script src="scripts/vendor/firebase.min.js" defer></script>
</head>
<body class="page--plain">

  <main class="touch">
    <div class="touch-sheet touch-sheet--static">
      <div class="touch-sheet__body">
        <h1 class="touch-sheet__title">A few questions and we'll come back to you</h1>
        <div id="touch-mount" class="touch__mount">
          <!-- Replaced by the form when the schema lands. On the film page
               scripts/touch.js paints the same three ticks itself. -->
          <div class="touch__wait" aria-hidden="true"><span></span><span></span><span></span></div>
          <noscript>
            <p class="touch__status">This form needs JavaScript.</p>
          </noscript>
        </div>
      </div>
    </div>
    <p class="touch__status">
      <a href="index.html">PowerPod Platform</a>
    </p>
  </main>

</body>
</html>
